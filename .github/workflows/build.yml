name: Build/release
on: push
jobs:
  build:
    if: "contains(github.event.head_commit.message, '[build]')"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: yarn install --frozen-lockfile
      - run: yarn dist
      - uses: actions/upload-artifact@v4
        with:
          name: veditbox
          path: dist/*.dmg
